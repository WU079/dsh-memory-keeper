# ============================================================================
# dsh-memory-keeper —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile web add link:/path/to/dsh-memory-keeper   # 本地开发
#   dsh plugin --profile web add dsh-memory-keeper                 # 发到 npm 之后
#
# 组成顺序：每个 bundle 的 patch 按 `dsh.profile.bundles` 顺序叠，再叠 profile 自己那层。
# ============================================================================

- insert:
    - id: memory-keeper
      name: dsh-memory-keeper
      config:
        # 真正的用户配置在 $DSH_HOME/memory-keeper/config.json 里（设置面板或 /mem 命令改），
        # 这里只放一个总开关的默认值，别在这里写数据目录之类的运行时配置。
        enabled: true
